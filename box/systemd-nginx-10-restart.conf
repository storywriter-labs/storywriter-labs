# Stock nginx.service ships Restart=no. On 2026-07-29 an unattended libc6
# upgrade restarted nginx, its ExecStartPre config test failed on a transient
# DNS error, and nothing ever retried -- the site stayed down for two days.
#
# StartLimitIntervalSec=0 disables the start rate limiter, so systemd keeps
# retrying instead of giving up. Giving up after N attempts would recreate the
# exact failure this is meant to prevent, just later.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=5s
