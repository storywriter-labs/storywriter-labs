map $status $header_content_type_options {
    204 "";
    default "nosniff";
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name labs.storywriter.net;
    root /var/www/storywriter-labs/system/nginx-root; # Used for acme.sh SSL verification (https://acme.sh)

    ssl_certificate /etc/letsencrypt/labs.storywriter.net/fullchain.cer;
    ssl_certificate_key /etc/letsencrypt/labs.storywriter.net/labs.storywriter.net.key;
    include /etc/nginx/snippets/ssl-params.conf;

    # ap.ghost.org is resolved per-request, not at startup. A literal
    # hostname in proxy_pass makes nginx resolve it while parsing the
    # config, so a transient DNS failure stops nginx from starting at
    # all and takes the whole site down (outage on 2026-07-29). It also
    # pins one IP forever, ignoring the 300s TTL on that record.
    # AmazonProvidedDNS is used rather than the systemd-resolved stub so
    # resolution does not depend on a local daemon that package upgrades
    # restart. No IPv6 egress on this instance, so AAAA lookups are off.
    resolver 169.254.169.253 valid=30s ipv6=off;
    resolver_timeout 5s;

    location ~ /.ghost/activitypub/* {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        add_header X-Content-Type-Options $header_content_type_options;
        proxy_ssl_server_name on;
        proxy_ssl_name ap.ghost.org;
        # $request_uri (not $uri) keeps the query string, which webfinger needs.
        set $ap_upstream "ap.ghost.org";
        proxy_pass https://$ap_upstream$request_uri;
    }

    location ~ /.well-known/(webfinger|nodeinfo) {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        add_header X-Content-Type-Options $header_content_type_options;
        proxy_ssl_server_name on;
        proxy_ssl_name ap.ghost.org;
        # $request_uri (not $uri) keeps the query string, which webfinger needs.
        set $ap_upstream "ap.ghost.org";
        proxy_pass https://$ap_upstream$request_uri;
    }

    location / {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        proxy_pass http://127.0.0.1:2368;
        
        add_header X-Content-Type-Options $header_content_type_options;
    }

    client_max_body_size 1g;
}
