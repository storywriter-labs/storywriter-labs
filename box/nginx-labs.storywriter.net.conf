map $status $header_content_type_options {
    204 "";
    default "nosniff";
}

server {
    listen 80;
    listen [::]:80;

    server_name labs.storywriter.net;
    root /var/www/storywriter-labs/system/nginx-root; # Used for acme.sh SSL verification (https://acme.sh)

    # Same lazy-DNS treatment as the -ssl config. nginx parses every enabled
    # site before serving anything, so a literal hostname in proxy_pass here
    # is resolved at startup too -- leaving it stock would keep the whole
    # 2026-07-29 failure mode alive even though the -ssl file was fixed.
    resolver 169.254.169.253 valid=30s ipv6=off;
    resolver_timeout 5s;

    location ~ /.ghost/activitypub/* {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        add_header X-Content-Type-Options $header_content_type_options;
        proxy_ssl_server_name on;
        proxy_ssl_name ap.ghost.org;
        # $request_uri (not $uri) keeps the query string, which webfinger needs.
        set $ap_upstream "ap.ghost.org";
        proxy_pass https://$ap_upstream$request_uri;
    }

    location ~ /.well-known/(webfinger|nodeinfo) {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        add_header X-Content-Type-Options $header_content_type_options;
        proxy_ssl_server_name on;
        proxy_ssl_name ap.ghost.org;
        # $request_uri (not $uri) keeps the query string, which webfinger needs.
        set $ap_upstream "ap.ghost.org";
        proxy_pass https://$ap_upstream$request_uri;
    }

    location / {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        proxy_pass http://127.0.0.1:2368;
        
        add_header X-Content-Type-Options $header_content_type_options;
    }

    location ~ ^/.well-known/acme-challenge {
        allow all;
    }

    client_max_body_size 50m;
}
